<div class="title">対訳 登録</div><br>&nbsp;翻訳済みのデータなどを対訳として登録しておくと、&nbsp;<br>
&nbsp;「みんなの自動翻訳」が学習して&nbsp;<br>

&nbsp;以後の翻訳作業に役立てることができます。&nbsp;<br>
&nbsp;&nbsp;<br>
<hr align="left" width="80%">
&nbsp;・&nbsp;対訳集の追加<br>
&nbsp;&nbsp;対訳データの追加先となる対訳集の作成は<br>
&nbsp;&nbsp;「みんなの自動翻訳」サイト上で行います。<br>
&nbsp;&nbsp;<img alt="" src="images/image080.png"><br>
&nbsp;&nbsp;<br>
<hr align="left" width="80%">
&nbsp;・&nbsp;対訳の登録<br>
&nbsp;&nbsp;<img alt="" src="images/image083.png"><br>
&nbsp;&nbsp;<br>&nbsp;&nbsp;Tradosのエディタ上から翻訳文を読み込みます。<br>
&nbsp;&nbsp;対訳の登録先の辞書を選択して、<br>

&nbsp;&nbsp;登録ボタンを押してください。<br>
